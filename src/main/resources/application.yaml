spring:
  profiles:
    active: local

  servlet:
    multipart:
      # 답변 녹음(120초, 약 2MB) 업로드 한도. 모든 multipart 업로드에 공통 적용된다.
      max-file-size: 10MB
      max-request-size: 11MB

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

server:
  port: 8080

weiver:
  matching:
    # 매칭 교체의 advisory lock 대기만 제한한다. 초과 시 롤백하고 기존 리스너 정책으로 DLQ에 보낸다.
    lock-timeout-ms: ${MATCHING_LOCK_TIMEOUT_MS:5000}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
