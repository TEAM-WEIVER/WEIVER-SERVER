spring:
  profiles:
    active: local

  servlet:
    multipart:
      # 답변 녹음(120초, 약 2MB) 업로드 한도. 모든 multipart 업로드에 공통 적용된다.
      max-file-size: 10MB
      max-request-size: 11MB

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

server:
  port: 8080

weiver:
  applicant-analysis:
    # 지원자 분석 요청의 마감 시간. 제출 건의 deadline_at = requested_at + 이 값이다(시간 초과 처리는 #207).
    deadline: 30m

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html