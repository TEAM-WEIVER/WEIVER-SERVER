# 알림 받을 곳 (#180): Discord 채널 웹훅.
# 웹훅 주소는 비밀값이라 파일에 넣지 않고 ALERT_WEBHOOK_URL 환경 변수로만 받는다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: weiver-alerts
    receivers:
      - uid: weiver-alerts-discord
        type: discord
        disableResolveMessage: false
        settings:
          url: ${ALERT_WEBHOOK_URL}
          use_discord_username: false

policies:
  - orgId: 1
    receiver: weiver-alerts
    group_by: [grafana_folder, alertname, queue, flow, job]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
