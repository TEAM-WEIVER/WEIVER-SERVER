# 알림 받을 곳 (#180). 채널(Slack·Discord 등)은 아직 정하지 않았다.
# 채널을 정하면 type 과 settings 를 그 채널에 맞게 바꾸고, 주소는 ALERT_WEBHOOK_URL 환경 변수로만 넣는다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: weiver-alerts
    receivers:
      - uid: weiver-alerts-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${ALERT_WEBHOOK_URL}

policies:
  - orgId: 1
    receiver: weiver-alerts
    group_by: [grafana_folder, alertname, queue, flow, job]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
