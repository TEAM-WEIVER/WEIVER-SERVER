<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI', 'Apple SD Gothic Neo', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- card background -->
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">WEIVER — 계층형 아키텍처</text>

  <!-- Client -->
  <rect x="40" y="84" width="140" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Client</text>
  <text x="110" y="128" text-anchor="middle" font-size="11" fill="#57606a">Web / App</text>

  <!-- Client -> Server arrows -->
  <line x1="182" y1="104" x2="236" y2="104" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="209" y="97" text-anchor="middle" font-size="10" fill="#57606a">REST</text>
  <line x1="182" y1="132" x2="236" y2="132" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="209" y="150" text-anchor="middle" font-size="9" fill="#57606a">WS·STOMP</text>

  <!-- Server box -->
  <rect x="240" y="66" width="440" height="156" rx="10" fill="#ffffff" stroke="#6DB33F" stroke-width="2"/>
  <text x="460" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#2da44e">Spring Boot API Server</text>

  <!-- layers -->
  <rect x="250" y="112" width="96" height="66" rx="7" fill="#eef7e8" stroke="#6DB33F" stroke-width="1.3"/>
  <text x="298" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Controller</text>
  <rect x="354" y="112" width="96" height="66" rx="7" fill="#eef7e8" stroke="#6DB33F" stroke-width="1.3"/>
  <text x="402" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Service</text>
  <rect x="458" y="112" width="96" height="66" rx="7" fill="#eef7e8" stroke="#6DB33F" stroke-width="1.3"/>
  <text x="506" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Repository</text>
  <rect x="562" y="112" width="108" height="66" rx="7" fill="#eef7e8" stroke="#6DB33F" stroke-width="1.3"/>
  <text x="616" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Domain</text>
  <text x="616" y="162" text-anchor="middle" font-size="10" fill="#57606a">JPA 엔티티</text>

  <!-- layer flow arrows -->
  <line x1="346" y1="145" x2="353" y2="145" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="450" y1="145" x2="457" y2="145" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="554" y1="145" x2="561" y2="145" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="460" y="204" text-anchor="middle" font-size="10" fill="#57606a">@Transactional 은 Service 계층 · 의존 방향 controller → service → repository → domain</text>

  <!-- Data stores -->
  <rect x="300" y="252" width="120" height="52" rx="8" fill="#fde8e8" stroke="#DC382D" stroke-width="1.5"/>
  <text x="360" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Redis 7</text>
  <text x="360" y="291" text-anchor="middle" font-size="10" fill="#57606a">토큰·인증</text>

  <rect x="470" y="252" width="150" height="52" rx="8" fill="#e8f0fe" stroke="#4169E1" stroke-width="1.5"/>
  <text x="545" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">PostgreSQL 15</text>
  <text x="545" y="291" text-anchor="middle" font-size="10" fill="#57606a">JPA · QueryDSL · ddl-auto</text>

  <rect x="662" y="252" width="120" height="52" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="722" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">AWS S3</text>
  <text x="722" y="291" text-anchor="middle" font-size="10" fill="#57606a">파일·이미지</text>

  <!-- server -> stores -->
  <line x1="392" y1="222" x2="366" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="545" y1="222" x2="545" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="648" y1="222" x2="710" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Async band -->
  <rect x="300" y="346" width="180" height="56" rx="8" fill="#fff0e0" stroke="#FF6600" stroke-width="1.5"/>
  <text x="390" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">RabbitMQ 4.2</text>
  <text x="390" y="387" text-anchor="middle" font-size="10" fill="#57606a">도메인 이벤트</text>

  <rect x="520" y="346" width="200" height="56" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="620" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">AI Server</text>
  <text x="620" y="387" text-anchor="middle" font-size="10" fill="#57606a">분석 · 매칭 · 면접</text>

  <!-- service -> rabbitmq (async) -->
  <line x1="360" y1="222" x2="372" y2="344" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <text x="300" y="330" text-anchor="middle" font-size="10" fill="#57606a">이벤트(커밋 후 발행)</text>

  <!-- rabbitmq <-> ai server -->
  <line x1="482" y1="374" x2="518" y2="374" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)" marker-start="url(#ah)"/>

  <!-- legend -->
  <line x1="600" y1="330" x2="624" y2="330" stroke="#6b7280" stroke-width="1.5"/>
  <text x="630" y="334" font-size="10" fill="#57606a">동기 호출</text>
  <line x1="706" y1="330" x2="730" y2="330" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="736" y="334" font-size="10" fill="#57606a">비동기 이벤트</text>
</svg>
